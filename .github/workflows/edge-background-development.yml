name: Edge AI high-background corroboration development

on:
  push:
    branches:
      - feature/edge-ai-background-robustness
    paths:
      - "demos/edge1000-v4/edge/**"
      - "demos/edge1000-v4/tests/test_background_corroboration.py"
      - "demos/edge1000-v4/lab/background_gate_study.py"
      - ".github/workflows/edge-background-development.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: demos/edge1000-v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install vendored MQTT dependency offline
        run: python -m pip install --no-index -r requirements.txt
      - name: Run all original V4 + policy B2 + background regression tests
        run: python -m unittest discover -s tests -v
      - name: "One-factor sweep: temporal corroboration on development seeds only"
        run: python -m lab.background_gate_study --seeds 901 902 903 904 905 906 --out /tmp/wf-background-dev
      - name: Check original model and sample counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from csv import DictReader
          folder=Path('/tmp/wf-background-dev')
          obj=json.loads((folder/'selection.json').read_text())
          rows=list(DictReader((folder/'candidates.csv').open()))
          assert obj['model']=='rf-a288fc78989a'
          assert obj['development_seeds']==list(range(901,907))
          assert len(rows)==20
          assert next(x for x in rows if x['candidate']=='legacy' and x['mode']=='baseline')['fire_episodes']=='12'
          print('Selected on development only:',obj['candidate_for_one_sealed_test'])
          print('Not enabled in production; no weights changed.')
          PY
      - name: Preserve all measurements
        uses: actions/upload-artifact@v4
        with:
          name: edge-background-development-${{ github.sha }}
          path: /tmp/wf-background-dev/
          retention-days: 30
