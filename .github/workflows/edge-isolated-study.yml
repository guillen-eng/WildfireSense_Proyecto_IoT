name: WildfireSense isolated-node policy B study

on:
  push:
    branches:
      - feature/edge-ai-evidence-freeze
    paths:
      - "demos/edge1000-v4/edge/logic.py"
      - "demos/edge1000-v4/lab/isolated_policy_study.py"
      - "demos/edge1000-v4/lab/isolated_sealed_test.py"
      - "demos/edge1000-v4/lab/threshold_sensitivity.py"
      - "demos/edge1000-v4/tests/test_isolated_escalation.py"
      - ".github/workflows/edge-isolated-study.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: demos/edge1000-v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install vendored MQTT dependency
        run: python -m pip install --no-index -r requirements.txt
      - name: All unit tests (V4 + option B)
        run: python -m unittest discover -s tests -v
      - name: Development sensitivity study for isolated nodes (6 seeds)
        run: python -m lab.isolated_policy_study --seeds 301 302 303 304 305 306 --out /tmp/wildfiresense-isolated-study
      - name: Confirm baseline remains disabled and candidate reports are complete
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          folder=Path('/tmp/wildfiresense-isolated-study')
          meta=json.loads((folder/'study.json').read_text())
          data=list(csv.DictReader((folder/'candidates.csv').open()))
          assert meta['model']=='rf-a288fc78989a'
          assert meta['candidate_count']==16 and len(data)==34
          assert all(x['isolated_detected']=='0' for x in data if x['candidate']=='off_baseline')
          print('Manual gate required. No candidate automatically deployed.')
          PY
      - name: Sealed test for PRE-REGISTERED single candidate on fresh 601-612
        run: python -m lab.isolated_sealed_test --seeds 601 602 603 604 605 606 607 608 609 610 611 612 --out /tmp/wildfiresense-isolated-sealed
      - name: Read sealed decision (do not automatically deploy)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          item=json.loads(Path('/tmp/wildfiresense-isolated-sealed/decision.json').read_text())
          assert item['model']=='rf-a288fc78989a'
          assert item['seeds']==list(range(601,613))
          print('Passed limited synthetic gate:',item['approved_for_limited_synthetic_demo'])
          print('Rejection reasons:',item['reasons'])
          print('No promotion has been performed.')
          PY
      - name: Attach isolated policy options and episode evidence
        uses: actions/upload-artifact@v4
        with:
          name: isolated-policy-b-${{ github.sha }}
          path: |
            /tmp/wildfiresense-isolated-study/
            /tmp/wildfiresense-isolated-sealed/
          retention-days: 30
