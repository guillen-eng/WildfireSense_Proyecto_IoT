services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  simulator:
    profiles: [simulacion]
    build: ./simulator
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      SENSOR_COUNT: "5"
      INTERVAL_SECONDS: "2"
    restart: unless-stopped
